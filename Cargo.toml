[package]
name = "linux-mouse-fix"
version = "0.1.0"
edition = "2024"
description = "Mac Mouse Fix-style smooth scrolling and mouse button gestures for GNOME on Wayland"
license = "MIT"
repository = "https://github.com/Sarwan-09/linux-mouse-fix"

[dependencies]
evdev = "0.13.2"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[profile.release]
lto = true
strip = true
